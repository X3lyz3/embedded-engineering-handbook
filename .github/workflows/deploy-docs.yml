name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Python calculator script syntax and execution
        run: |
          python3 -m py_compile scripts/stm32_timer_calc.py
          python3 scripts/stm32_timer_calc.py --clk 72000000 --freq 50 --bits 16

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Prepare docs directory from README and subfolders
        run: |
          mkdir -p docs/javascripts
          cp README.md docs/index.md
          for dir in pinouts scripts simulations; do
            if [ -d "$dir" ]; then cp -r "$dir" docs/; fi
          done
          cat << 'EOF' > docs/javascripts/katex.js
          document$.subscribe(({ body }) => {
            renderMathInElement(body, {
              delimiters: [
                { left: "$$",  right: "$$",  display: true },
                { left: "$",   right: "$",   display: false },
                { left: "\\(", right: "\\)", display: false },
                { left: "\\[", right: "\\]", display: true }
              ],
            })
          })
          EOF

      - name: Build and Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --strict
